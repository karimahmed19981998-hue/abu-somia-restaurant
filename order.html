<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أبو سمية | اطلب أونلاين</title><link rel="stylesheet" href="customer.css"></head><body><header><b>أبو سمية</b><small>أكل من الزمن الجميل</small></header><section class="hero"><h1>أكل بيتي بطعم الزمن الجميل</h1><p>اختار القسم واطلب أكلك بسهولة</p></section><main><h1>اطلب أكلك أونلاين</h1><div id="cats" class="cats"></div><div id="menuGrid" class="grid"></div><section class="tracking"><h2>تابع طلبك</h2><p>اكتب رقم الطلب ورقم الموبايل لمعرفة حالته.</p><div class="trackform"><input id="trackNo" type="number" placeholder="رقم الطلب"><input id="trackPhone" placeholder="رقم الموبايل"><button id="trackBtn">متابعة الطلب</button></div><div id="trackResult"></div></section></main><div id="cart" class="cartbar"><b id="cartTotal">0 ج.م</b><button id="openCart">عرض السلة</button></div><dialog id="checkout"><button id="closeCart">إغلاق</button><h2>سلة الطلب</h2><div id="cartItems"></div><div class="checkout-total">الإجمالي <b id="checkoutSum">0 ج.م</b></div><input id="name" placeholder="الاسم"><input id="phone" placeholder="رقم الموبايل"><textarea id="notes" placeholder="ملاحظات"></textarea><div class="extras"><h3>إضافات اختيارية</h3><label><input type="checkbox" class="extra" data-name="طحينة" data-price="10"> طحينة <b>10 ج.م</b></label><label><input type="checkbox" class="extra" data-name="تومية" data-price="10"> تومية <b>10 ج.م</b></label><label><input type="checkbox" class="extra" data-name="بابا غنوج" data-price="10"> بابا غنوج <b>10 ج.م</b></label><label><input type="checkbox" class="extra" data-name="كول سلو" data-price="10"> كول سلو <b>10 ج.م</b></label></div><h3>طريقة الدفع</h3><p class="payhint">اختر الطريقة المناسبة لإتمام طلبك</p><label><input type="radio" name="pay" value="cash" checked> كاش</label><label><input type="radio" name="pay" value="instapay"> InstaPay</label><label><input type="radio" name="pay" value="vodafone_cash"> Vodafone Cash</label><div id="transferBox" class="transferbox hidden"><b id="transferTitle"></b><p id="transferText"></p><label class="receipt">صورة إيصال التحويل<input id="receipt" type="file" accept="image/*"></label></div><button id="confirm">تأكيد الطلب</button><p id="msg"></p></dialog><script type="module" src="customer-dialog.js"></script></body></html>
