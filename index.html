<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أبو سمية | إدارة المطعم</title><link rel="stylesheet" href="style.css"></head><body><div id="auth" class="auth"><div class="card"><div class="logo">أبو سمية</div><p>أكل من الزمن الجميل</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">تسجيل الدخول</button><button id="signup" class="secondary">إنشاء حساب المدير</button><button id="forgot" class="secondary">نسيت كلمة المرور؟</button><div id="msg"></div></div></div><div id="app" class="hidden"><aside><h2>أبو سمية</h2><small>إدارة المطعم</small><nav><button data-tab="dash">الرئيسية</button><button data-tab="orders">الطلبات</button><button data-tab="menu">المنيو</button></nav><button id="logout">تسجيل الخروج</button></aside><main><header><div><h1 id="title">لوحة التحكم</h1><p>متابعة المطعم والطلبات لحظة بلحظة</p></div><button id="newOrder">+ طلب جديد</button></header><section id="dash"><div class="stats"><article><span>مبيعات اليوم</span><b id="sales">0 ج.م</b></article><article><span>طلبات اليوم</span><b id="count">0</b></article><article><span>قيد التحضير</span><b id="prep">0</b></article><article><span>جاهزة للاستلام</span><b id="ready">0</b></article></div><h3>أحدث الطلبات</h3><div id="recent" class="panel"></div></section><section id="orders" class="hidden"><h3>الطلبات</h3><div id="ordersList" class="panel"></div></section><section id="menu" class="hidden"><div class="row"><h3>المنيو</h3><button id="refreshMenu">تحديث</button></div><div id="menuList" class="menu-grid"></div></section></main></div><div id="orderModal" class="modal hidden"><div class="modal-card"><div class="row"><h3>طلب جديد</h3><button id="closeModal" class="ghost">✕</button></div><div class="form-grid"><input id="customerName" placeholder="اسم العميل"><input id="customerPhone" placeholder="رقم الهاتف"><select id="paymentMethod"><option value="cash">كاش</option><option value="instapay">InstaPay</option></select></div><div id="orderMenu" class="order-menu"></div><div class="order-total">الإجمالي: <b id="orderTotal">0 ج.م</b></div><textarea id="orderNotes" placeholder="ملاحظات الطلب"></textarea><button id="saveOrder">حفظ الطلب</button><div id="orderMsg"></div></div></div><script type="module" src="app.js"></script></body></html>
